<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Membership Validation</title>
  <!-- Add a link to a library that provides icons (e.g., FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
  <div class="fv-row mb-10 ">
    <label class="form-label fs-6 fw-bolder text-dark w-100 required">Category</label>

    <select name="categoryname" required="true"
      class="form-select form-control form-control-lg form-control-solid border-secondary Category" id="temp_upload">

      <option value="" disabled selected>Select a category</option>
      <!-- Assuming this is your template to fill in -->
      <!-- {% for cat in cat_table %}
      <option value="{{cat.category_name}}">{{cat.category_name}}</option>
      {% endfor %} -->
    </select>
  </div>

  <div>
    <h4>Template Availability</h4>
    <div id="membershipvalidations" style="color: red;"></div>

    <div class="d-flex mt-5 mb-10">
      <div>
        <h6>Individual Membership</h6>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" checked value="true" name="ind_free" id="ind_free"
            onclick="validateCheckbox('ind_free', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="ind_free">
            Free Membership
          </label>
        </div>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" readonly value="true" name="ind_basic" id="ind_basic"
            onclick="validateCheckbox('ind_basic', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="ind_basic">
            Basic Membership
          </label>
        </div>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" readonly value="true" name="ind_pre" id="ind_pre"
            onclick="validateCheckbox('ind_pre', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="ind_pre">
            Premium Membership
          </label>
        </div>
      </div>
      <div class="ms-20">
        <h6>Business Membership</h6>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" readonly value="true" name="bus_free" id="bus_free"
            onclick="validateCheckbox('bus_free', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="bus_free">
            Free Membership
          </label>
        </div>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" readonly value="true" name="bus_basic" id="bus_basic"
            onclick="validateCheckbox('bus_basic', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="bus_basic">
            Basic Membership
          </label>
        </div>
        <div class="form-check mt-5">
          <input class="form-check-input" type="checkbox" readonly value="true" name="bus_pre" id="bus_pre"
            onclick="validateCheckbox('bus_pre', 'You cannot change this checkbox.');">
          <label class="form-check-label" for="bus_pre">
            Premium Membership
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/file-saver/dist/FileSaver.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

  <script>
    function validateCheckbox(checkboxName, validationMessage) {
      var checkbox = document.getElementsByName(checkboxName)[0];
      var validationDiv = document.getElementById('membershipvalidations');
      if (checkbox.checked) {
        checkbox.checked = false;
        validationDiv.innerText = validationMessage;
      } else {
        checkbox.checked = true;
        validationDiv.innerText = validationMessage;
      }
    }
  </script>
</body>

</html>
